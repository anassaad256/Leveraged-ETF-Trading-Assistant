name: CI
on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from backend.analyzer import analyze_ticker; print('All imports OK')"

      - name: Run syntax check
        run: python -m py_compile backend/analyzer.py && python -m py_compile backend/app.py && python -m py_compile api/analyze.py
